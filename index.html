<script>
const DATA={"python":[{"id":"Practical 1A","q":"Create a program that asks the user to enter their name and age. Print out a message addressed to them that tells them the year in which they will turn 100 years old.","code":"Name = input(\"Enter your name:\")\nage = int(input(\"Enter your age:\"))\nyear = str((2026 - age) + 100)\nprint(Name + \" you will be 100 year old in the year \" + year)","out":"Enter your name:- Gaurav\nEnter your age:- 19\nGaurav you will be year old in the year 2007"},{"id":"Practical 1B","q":"Take a number from the user and, depending on whether the number is even or odd, print out an appropriate message to the user.","code":"a = int(input(\"Enter any number\"))\nif (a % 2 == 0):\n    print(a, \"is even number\")\nelse:\n    print(a, \"is a odd number\")","out":"Enter any number : 560\n560 is even number\n\nEnter any number : 567\n567 is odd number"},{"id":"Practical 1C","q":"Write a program to accept the SGPI from the user and print the corresponding grade based on the following.","code":"def get_sgpi_grade():\n    try:\n        sgpi = float(input(\"Enter your SGPI:\"))\n        if sgpi \u003c 0.0 or sgpi > 10.0:\n            print(\"Invalid input : SGPI must be between 0.0 and 10.0\")\n            return\n        if 9.00 \u003c= sgpi \u003c= 10.00:\n            grade = \"O\"\n        elif 8.00 \u003c= sgpi \u003c= 9.00:\n            grade = \"A+\"\n        elif 7.00 \u003c= sgpi \u003c= 8.00:\n            grade = \"A\"\n        elif 6.00 \u003c= sgpi \u003c= 7.00:\n            grade = \"B+\"\n        elif 5.50 \u003c= sgpi \u003c= 7.00:\n            grade = \"B\"\n        elif 5.00 \u003c= sgpi \u003c= 5.50:\n            grade = \"C\"\n        elif 4.00 \u003c= sgpi \u003c= 5.00:\n            grade = \"P\"\n        else:\n            grade = \"F\"\n        print(f\"your grade is: {grade}\")\n    except ValueError:\n        print(\"Invalid input! Please enter a valid SGPI value.\")\n\nget_sgpi_grade()","out":"Enter your SGPI : 11\nInvalid input \"SGPI must be between 0.0 and 10.0\""},{"id":"Practical 2A","q":"Write a program to generate the Fibonacci series.","code":"v = int(input(\"Enter the range for fibonacci series :\"))\na = 0\nb = 1\nfor n in range(0, v):\n    if (n \u003c= 1):\n        c = n\n    else:\n        c = a + b\n        a = b\n        b = c\n    print(c)","out":"Enter your range for fibonacci series : 10\n0\n1\n2\n3\n5\n8\n13\n21\n34\n55"},{"id":"Practical 2B","q":"Write a program to accept a number from the user and display the sum of its digits.","code":"Num = int(input(\"Enter a number:\"))\nSum_digit = 0\nwhile Num > 0:\n    digit = Num % 10\n    Sum_digit = Sum_digit + digit\n    Num = Num // 10\nprint(\"Sum of Digits is:\", Sum_digit)","out":"Enter a number : 8769\nSum of digits : 30"},{"id":"Practical 3(A)","q":"Write a program for basic NumPy operations.","code":"import numpy as np\narr = np.array([10, 20, 30, 40, 50])\nprint(\"Original array :\", arr)\nprint(\"Array + 5 :\", arr + 5)\nprint(\"Array * 2 :\", arr * 2)\nprint(\"Sum of all element :\", arr.sum())\nprint(\"First element :\", arr[0])\nprint(\"Last element :\", arr[-1])\nprint(\"Element from index 1 to 3 :\", arr[1:4])\nprint(\"Element from start to index 2 :\", arr[:3])\nprint(\"Element from index 2 to end :\", arr[2:])","out":"Original array : [10, 20, 30, 40, 50]\nArray + 5 = [15, 25, 35, 45, 55]\nArray * 2 = [20, 40, 60, 80, 100]\nSum of all element : 150\nFirst element : 10\nLast element : 50\nElement from index 1 to 3 : [20, 30, 40]\nElement from start to index 2 : [10, 20, 30]\nElement from index 2 to end : [30, 40, 50]"},{"id":"Practical 3(B)","q":"Write a program to implement mathematical functions on an array.","code":"import numpy as np\narr = np.array([5, 10, 15, 20, 25])\nprint(\"Original array :\", arr)\nprint(\"Sum of all element :\", np.sum(arr))\nprint(\"mean (average) :\", np.mean(arr))\nprint(\"maximum :\", np.max(arr))\nprint(\"minimum :\", np.min(arr))\nprint(\"Square root :\", np.sqrt(arr))\nprint(\"Standard deviation :\", np.std(arr))\nprint(\"product of all element :\", np.prod(arr))","out":"Original array : [5, 10, 15, 20, 25]\nSum of all element : 75\nmean (average) : 15.0\nmaximum : 25\nminimum : 5\nSquare root : 5\nStandard deviation : [2.23606798 3.16227766 3.87298335 4]\nproduct of all element : 375000"},{"id":"Practical 3(C)","q":"Write a program on array aliasing and copying.","code":"import numpy as np\narr = np.array([10, 20, 30, 40])\nalias_arr = arr\ncopy_arr = arr.copy()\narr[0] = 100\nprint(\"Original array : (after change):\", arr)\nprint(\"Aliased array : (change reflect):\", alias_arr)\nprint(\"Copied array (no change):\", copy_arr)","out":"Original array : [100 20 30 40]\nCopied array : [10, 20, 30, 40]\nAliased array : [10, 20, 30 40]"},{"id":"Practical 4(A)","q":"Write a program on slicing, basic and advanced indexing on a NumPy array.","code":"import numpy as np\narr = np.array([[10, 20, 30],\n                [40, 50, 60],\n                [70, 80, 90]])\nprint(\"Element at (1,2) :\", arr[1, 2])\nprint(\"Sliced (row 0-1) :\", arr[0:2, :])\nprint(\"Sliced (col -1) :\", arr[:, 1])\nrow = [0, 2]\ncols = [1, 2]\nprint(\"Advanced indexing (0,1) & (2,2) :\", arr[row, cols])\nprint(\"Element > 50 :\", arr[arr > 50])","out":"Element at (1,2) : 60\nSliced (row 0-1) : [[10, 20, 30] [40, 50, 60]]\nSliced (col -1) : [20, 50, 80]\nAdvanced indexing : (0,1) & (2,2) :- [20 90]\nElements > 50 : [60, 70, 80, 90]"},{"id":"Practical 4(B)","q":"Write a program to analyse the dimensions and attributes of an array.","code":"import numpy as np\narr = np.array([[1, 2, 3], [4, 5, 6]])\nprint(\"Shape :\", arr.shape)\nprint(\"Dimension :\", arr.ndim)\nprint(\"Data type :\", arr.dtype)\nprint(\"Item Size :\", arr.itemsize)\nprint(\"Total bytes :\", arr.nbytes)","out":"Array [[1, 2, 3]\n       [4, 5, 6]]\nShape : (2, 3)\nDimension : 2\nSize : 6\nData type : int64\nItem Size : 8\nTotal bytes : 48"},{"id":"Practical 5(A)","q":"Write a function to check whether the input value is an Armstrong number, and also write a function to check whether it is a palindrome.","code":"def armnum(num):\n    Sum = 0\n    temp = num\n\n    while temp > 0:\n        digit = temp % 10\n        Sum += digit ** 3\n        temp //= 10\n\n    if num == Sum:\n        print(num, \"is an armstrong number\")\n    else:\n        print(num, \"is not an armstrong no\")\n\ndef palnum(num):\n    Sum = 0\n    temp = num\n\n    while num != 0:\n        rem = num % 10\n        Sum = rem + Sum * 10\n        num = num // 10\n\n    if temp == Sum:\n        print(temp, \"is a palindrome number\")\n    else:\n        print(temp, \"is not a palindrome number\")\n\nnum = int(input(\"enter any number :\"))\narmnum(num)\npalnum(num)","out":"enter any number : 153\n153 is an armstrong number\n153 is not a armstrong number"},{"id":"Practical 5(B)","q":"Write a recursive function to print the factorial of a given number.","code":"def fact(x):\n    if x == 1:\n        return 1\n    else:\n        return (x * fact(x - 1))\n\nnum = int(input(\"Enter any number:\"))\nprint(\"The factorial of\", num, \"is:\", fact(num))","out":"Enter any number : 20\nThe factorial of 23 is : 25852016738884976640000"},{"id":"Practical 6(A)","q":"Write a program to compute the number of characters and words in a string.","code":"text = input(\"Enter a string :\")\nchar_count = len(text.replace(\" \", \"\"))\nword_count = len(text.split())\nprint(\"Characters (no-space):\", char_count)\nprint(\"Words :\", word_count)","out":"Enter a string : abhinav College\nCharacters (no-space) : 14\nWords : 2"},{"id":"Practical 6(B)","q":"Create a file geometry.py to calculate base areas for the shapes Square and Circle. In another file, write a function pointyShapeVolume(x, y, squareBase) that calculates the volume of a square pyramid if squareBase is True, and of a right circular cone if squareBase is False. x is the length of an edge of a square if squareBase is True, and the radius of the circle when squareBase is False. y is the height of the object. First use squareBase to distinguish the cases. Use the circleArea and squareArea functions from the geometry module to calculate the base areas.","codeTitle":"geometry.py","code":"import math\n\ndef squareArea(side):\n    return side * side\n\ndef circleArea(radius):\n    return math.pi * radius * radius","code2Title":"main.py","code2":"from geometry import squareArea, circleArea\n\ndef pointyShapeVolume(x, y, squareBase):\n    if squareBase:\n        base_area = squareArea(x)\n    else:\n        base_area = circleArea(x)\n    volume = (1/3) * base_area * y\n    return volume\n\nif __name__ == \"__main__\":\n    print(\"Volume (Square Base):\", pointyShapeVolume(4, 9, True))\n    print(\"Volume (Circular Base):\", pointyShapeVolume(3, 5, False))","out":"Volume (Square Base) : 48.0\nVolume (Circular Base) : 47.12388980384689"},{"id":"Practical 7(A)","q":"Write a program that takes two lists and returns True if they have at least one common member.","code":"list1 = input(\"Enter elements of first list separated by space :\").split()\nlist2 = input(\"Enter elements of second list separated by space :\").split()\ncommon = False\nfor item in list1:\n    if item in list2:\n        common = True\n        break\nprint(\"Common element exists :\", common)","out":"Enter elements of first list separated by space : 10 20 30\nEnter elements of second list separated by space : 30 40 50\nCommon element exists : True"},{"id":"Practical 7(B)","q":"Write a Python script to sort (ascending and descending) a dictionary by value.","code":"# Input dictionary from the user\nd = {}\nn = int(input(\"Enter number of elements :\"))\nfor i in range(n):\n    key = input(\"Enter key :\")\n    value = int(input(\"Enter Value :\"))\n    d[key] = value\n\n# Sort in ascending order\nascending = dict(sorted(d.items(), key=lambda x: x[1]))\n\n# Sort in descending order\ndescending = dict(sorted(d.items(), key=lambda x: x[1], reverse=True))\n\nprint(\"Original Dictionary :\", d)\nprint(\"Ascending order :\", ascending)\nprint(\"Descending order :\", descending)","out":"Enter number of elements : 2\nEnter key : A\nEnter Value : 3\nEnter key : B\nEnter Value : 4\nOriginal dictionary : {'A': 3, 'B': 4}\nAscending order : {'A': 3, 'B': 4}\nDescending order : {'B': 4, 'A': 3}"},{"id":"Practical 7(C)","q":"Write a program with a function that returns the area and circumference of a circle as a tuple.","code":"import math\n\ndef Circle_details(r):\n    area = math.pi * r * r\n    circ = 2 * math.pi * r\n    return (area, circ)\n\nradius = float(input(\"enter radius :\"))\nresult = Circle_details(radius)\nprint(\"area of Circle :\", result[0])\nprint(\"Circumference of Circle :\", result[1])","out":"enter radius : 2\narea of Circle : 12.566370614359172\nCircumference of Circle : 12.566370614359172"},{"id":"Practical 8B (A)","q":"Write a program to perform basic file operations on text files and binary files. (A) Text file.","code":"with open(\"example3.txt\", \"w\") as f:\n    f.write(\"Hello Students welcome to python file Handling.\")\n\nwith open(\"example3.txt\", \"r\") as f:\n    content = f.read()\n    print(\"Text file Content :\", content)","out":"Text file Content : Hello Students welcome to python file Handling."},{"id":"Practical 8B (B)","q":"Write a program to perform basic file operations on text files and binary files. (B) Binary file.","code":"with open(\"example3.bin\", \"wb\") as bf:\n    data = b\"This is binary data\"\n    bf.write(data)\n\nwith open(\"example3.bin\", \"rb\") as bf:\n    b_content = bf.read()\n    print(\"Binary file Content :\", b_content)","out":"Binary file Content : b'This is binary data'"},{"id":"Practical 8C","q":"Write a Python program to read the last n lines of a file.","code":"def read_last_n_lines(filename, n):\n    with open(filename, \"r\") as f:\n        lines = f.readlines()\n        return lines[-n:]\n\nfile_name = \"example3.txt\"\nn = int(input(\"Enter number of last lines to read :\"))\nlast_lines = read_last_n_lines(file_name, n)\nprint(\"last\", n, \"lines :\")\nfor line in last_lines:\n    print(line.strip())","out":"Enter number of last lines to read : 5\nlast 5 lines :\nwelcome\nto\npython\nfile\nHandling."},{"id":"Practical 9A","q":"Write a program that compares two dates and prints which one is earlier.","code":"from datetime import datetime\ndate1 = input(\"Enter first date (dd/mm/yyyy) :\")\ndate2 = input(\"Enter second date (dd/mm/yyyy) :\")\nd1 = datetime.strptime(date1, \"%d/%m/%Y\")\nd2 = datetime.strptime(date2, \"%d/%m/%Y\")\nif d1 \u003c d2:\n    print(\"first date is earlier\")\nelif d1 > d2:\n    print(\"second date is earlier\")\nelse:\n    print(\"Both dates are same\")","out":"Enter first date (dd/mm/yyyy) : 12/09/2026\nEnter second date (dd/mm/yyyy) : 20/10/2026\nfirst date is earlier."},{"id":"Practical 9B","q":"Write a program to measure program execution time.","code":"import time\nstart = time.time()\ntotal = 0\nfor i in range(1, 10000001):\n    total += i\nend = time.time()\nprint(\"execution time :\", end - start, \"seconds\")","out":"execution time : 0.5365853309631348 seconds"},{"id":"Practical 9C","q":"Write a program using the calendar module to print the weekday of the first day of a given month and year.","code":"import calendar\nyear = int(input(\"Enter year :\"))\nmonth = int(input(\"Enter month (1-12) :\"))\nday_index = calendar.weekday(year, month, 1)\nday = [\"Monday\", \"Tuesday\", \"Wednesday\",\n       \"Thursday\", \"Friday\", \"Saturday\",\n       \"Sunday\"]\nprint(\"first day of\", month, year, \"is\", day[day_index])","out":"Enter year :- 2026\nEnter month (1-12) : 10\nfirst day of 10 is Thursday"}],"ds":[{"section":"Array Operations","id":"Practical 1a","q":"Insert an element at a specific position in an array.","code":"from array import array\n# Create an integer array\narr = array('i', [10, 20, 30, 40, 50])\n# Input element and position\nelem = int(input(\"Enter element to insert: \"))\npos = int(input(\"Enter position (0-based index): \"))\n# Insert element\narr.insert(pos, elem)\n# Display updated array\nprint(\"Array after insertion:\", arr.tolist())","out":"Enter element to insert: 25\nEnter position (0-based index): 3\nArray after insertion: [10, 20, 30, 25, 40, 50]"},{"id":"Practical 1b","q":"Delete an element from a specific position in an array.","code":"from array import array\n# Create an integer array\narr = array('i', [10, 20, 30, 40, 50])\n# Input position to delete\npos = int(input(\"Enter position to delete (0-based index): \"))\n# Check if position is valid\nif 0 \u003c= pos \u003c len(arr):\n    arr.pop(pos)  # Remove element at position\n    print(\"Array after deletion:\", arr.tolist())\nelse:\n    print(\"Invalid position!\")","out":"Enter position to delete (0-based index): 2\nArray after deletion: [10, 20, 40, 50]"},{"id":"Practical 1c","q":"Search for an element in an array (linear search).","code":"from array import array\n# Create an array\narr = array('i', [15, 25, 35, 45, 55])\n# Input element to search\nkey = int(input(\"Enter element to search: \"))\n# Linear search\nfound = False\nfor i in range(len(arr)):\n    if arr[i] == key:\n        print(\"Element found at position:\", i)\n        found = True\n        break\n# If not found\nif not found:\n    print(\"Element not found\")","out":"Enter element to search: 100\nElement not found"},{"section":"Linked List Manipulation","id":"Practical 2a","q":"Create a singly linked list.","code":"# Create first node (head)\nhead = {'data': 10, 'next': None}\n# Add more nodes manually\nsecond = {'data': 20, 'next': None}\nthird = {'data': 30, 'next': None}\n# Link nodes\nhead['next'] = second\nsecond['next'] = third\n# Display the linked list\ntemp = head\nprint(\"Linked List:\", end=\" \")\nwhile temp is not None:\n    print(temp['data'], end=\" -> \")\n    temp = temp['next']\nprint(\"None\")","out":"Linked List: 10 -> 20 -> 30 -> None"},{"id":"Practical 2b","q":"Insert a node at the beginning, at the end, and at a given position in a linked list.","code":"# Display list\ndef display(node):\n    while node:\n        print(node['data'], end=\" -> \")\n        node = node['next']\n    print(\"None\")\n\n# Insert at beginning\ndef insert_begin(head, value):\n    new = {'data': value, 'next': head}\n    return new\n\n# Insert at end\ndef insert_end(head, value):\n    new = {'data': value, 'next': None}\n    temp = head\n    while temp['next']:\n        temp = temp['next']\n    temp['next'] = new\n    return head\n\n# Insert at position (0-based)\ndef insert_pos(head, value, pos):\n    if pos == 0:\n        return insert_begin(head, value)\n    new = {'data': value, 'next': None}\n    temp = head\n    for _ in range(pos - 1):\n        if temp['next'] is None:\n            break\n        temp = temp['next']\n    new['next'] = temp['next']\n    temp['next'] = new\n    return head\n\n# --- 2. Initial List Creation ---\nhead = {'data': 10, 'next': None}\nnode2 = {'data': 20, 'next': None}\nhead['next'] = node2\n\n# --- 3. Test the Operations ---\nprint(\"Original list:\")\ndisplay(head)\n\n# Test insert at beginning\nhead = insert_begin(head, 5)\nprint(\"\\nAfter inserting at beginning:\")\ndisplay(head)\n\n# Test insert at end\nhead = insert_end(head, 50)\nprint(\"\\nAfter inserting at end:\")\ndisplay(head)\n\n# Test insert at position 2\nhead = insert_pos(head, 15, 2)\nprint(\"\\nAfter inserting at position 2:\")\ndisplay(head)","out":"Original list:\n10 -> 20 -> None\n\nAfter inserting at beginning:\n5 -> 10 -> 20 -> None\n\nAfter inserting at end:\n5 -> 10 -> 20 -> 50 -> None\n\nAfter inserting at position 2:\n5 -> 10 -> 15 -> 20 -> 50 -> None"},{"id":"Practical 2c","q":"Delete a node from a given position in a linked list.","code":"# Create linked list manually\nhead = {'data': 10, 'next': None}\nnode2 = {'data': 20, 'next': None}\nnode3 = {'data': 30, 'next': None}\nhead['next'] = node2\nnode2['next'] = node3\n\n# Display list\ndef display(node):\n    while node:\n        print(node['data'], end=\" -> \")\n        node = node['next']\n    print(\"None\")\n\n# Delete at position (0-based)\ndef delete_at_pos(head, pos):\n    if pos == 0:\n        return head['next']  # Remove first node\n    temp = head\n    for _ in range(pos - 1):\n        if temp['next'] is None:\n            return head  # Invalid position\n        temp = temp['next']\n    if temp['next']:\n        temp['next'] = temp['next']['next']\n    return head\n\n# --- Execution ---\nprint(\"Original List:\")\ndisplay(head)\n\n# Delete at position 1 (removes 20)\nhead = delete_at_pos(head, 1)\nprint(\"\\nAfter deleting position 1:\")\ndisplay(head)\n\n# Delete at position 0 (removes 10)\nhead = delete_at_pos(head, 0)\nprint(\"\\nAfter deleting position 0:\")\ndisplay(head)","out":"Original List:\n10 -> 20 -> 30 -> None\n\nAfter deleting position 1:\n10 -> 30 -> None\n\nAfter deleting position 0:\n30 -> None"},{"section":"Stack Application","id":"Practical 3a","q":"Implement a stack using an array.","code":"# Empty stack\nstack = []\n\n# Push operation\ndef push(item):\n    stack.append(item)\n    print(f\"Pushed: {item}\")\n\n# Pop operation\ndef pop():\n    if not stack:\n        print(\"Stack is empty!\")\n    else:\n        print(f\"Popped: {stack.pop()}\")\n\n# Display stack\ndef display():\n    print(\"Stack (top to bottom):\", stack[::-1])\n\n# --- Test the stack ---\npush(10)\npush(20)\npush(30)\ndisplay()\npop()\ndisplay()","out":"Pushed: 10\nPushed: 20\nPushed: 30\nStack (top to bottom): [30, 20, 10]\nPopped: 30\nStack (top to bottom): [20, 10]"},{"id":"Practical 3b","q":"Convert an infix expression to postfix notation using a stack.","code":"# Function to check precedence\ndef precedence(op):\n    if op in ('+', '-'):\n        return 1\n    if op in ('*', '/'):\n        return 2\n    return 0\n\n# Function to convert infix to postfix\ndef infix_to_postfix(exp):\n    stack = []\n    result = \"\"\n    for ch in exp:\n        if ch.isalnum():          # Operand: directly add\n            result += ch\n        elif ch == '(':           # Left bracket: push\n            stack.append(ch)\n        elif ch == ')':           # Right bracket: pop till '('\n            while stack and stack[-1] != '(':\n                result += stack.pop()\n            stack.pop()           # Remove '('\n        else:                     # Operator\n            while stack and precedence(stack[-1]) >= precedence(ch):\n                result += stack.pop()\n            stack.append(ch)\n    # Pop all remaining operators\n    while stack:\n        result += stack.pop()\n    return result\n\n# --- Example use ---\nexp = \"(A+B)*C\"\nprint(\"Infix Expression: \", exp)\nprint(\"Postfix Expression: \", infix_to_postfix(exp))","out":"Infix Expression:  (A+B)*C\nPostfix Expression:  AB+C*"},{"section":"Queue Application","id":"Practical 4a","q":"Implement a queue using an array.","code":"# Create an empty queue\nqueue = []\n\n# Check if queue is empty\ndef is_empty():\n    return len(queue) == 0\n\n# Enqueue operation (Insert at end)\ndef enqueue(item):\n    queue.append(item)\n\n# Dequeue operation (Remove from front)\ndef dequeue():\n    if not is_empty():\n        return queue.pop(0)\n    else:\n        return \"Queue is empty\"\n\n# Display queue\ndef display():\n    print(\"Queue:\", queue)\n\n# Example use\nenqueue(10)\nenqueue(20)\nenqueue(30)\ndisplay()\nprint(\"Removed:\", dequeue())\ndisplay()","out":"Queue: [10, 20, 30]\nRemoved: 10\nQueue: [20, 30]"},{"id":"Practical 4b","q":"Simulate a simple queuing system (e.g., a customer service queue).","code":"# Empty queue\nqueue = []\n\n# Enqueue customer\ndef arrive(customer_name):\n    queue.append(customer_name)\n    print(customer_name, \"has arrived.\")\n\n# Dequeue customer\ndef serve():\n    if queue:\n        served = queue.pop(0)\n        print(served, \"is being served.\")\n    else:\n        print(\"No customers to serve.\")\n\n# Display current queue\ndef show_queue():\n    print(\"Waiting Queue:\", queue)\n\n# Example Simulation\narrive(\"Customer1\")\narrive(\"Customer2\")\narrive(\"Customer3\")\nshow_queue()\nserve()\nshow_queue()\narrive(\"Customer4\")\nserve()\nserve()\nserve()\nserve()  # No one left","out":"Customer1 has arrived.\nCustomer2 has arrived.\nCustomer3 has arrived.\nWaiting Queue: ['Customer1', 'Customer2', 'Customer3']\nCustomer1 is being served.\nWaiting Queue: ['Customer2', 'Customer3']\nCustomer4 has arrived.\nCustomer2 is being served.\nCustomer3 is being served.\nCustomer4 is being served."},{"section":"Binary Search Tree","id":"Practical 5a","q":"Create a binary search tree.","code":"# Define a node using dictionary\ndef create_node(data):\n    return {\"data\": data, \"left\": None, \"right\": None}\n\n# Insert into BST\ndef insert(root, data):\n    if root is None:\n        return create_node(data)\n    if data \u003c root[\"data\"]:\n        root[\"left\"] = insert(root[\"left\"], data)\n    else:\n        root[\"right\"] = insert(root[\"right\"], data)\n    return root\n\n# Inorder traversal (left -> root -> right)\ndef inorder(root):\n    if root is not None:\n        inorder(root[\"left\"])\n        print(root[\"data\"], end=\" \")\n        inorder(root[\"right\"])\n\n# Example usage\nroot = None\nvalues = [50, 30, 70, 20, 40, 60, 80]\nfor val in values:\n    root = insert(root, val)\nprint(\"Inorder Traversal of BST:\")\ninorder(root)","out":"Inorder Traversal of BST:\n20 30 40 50 60 70 80"},{"id":"Practical 5b","q":"Insert nodes into a binary search tree.","code":"# Create a node as a dictionary\ndef create_node(data):\n    return {\"data\": data, \"left\": None, \"right\": None}\n\n# Insert a value into the BST\ndef insert(root, data):\n    if root is None:\n        return create_node(data)\n    if data \u003c root[\"data\"]:\n        root[\"left\"] = insert(root[\"left\"], data)\n    else:\n        root[\"right\"] = insert(root[\"right\"], data)\n    return root\n\n# Inorder traversal to check BST structure\ndef inorder(root):\n    if root:\n        inorder(root[\"left\"])\n        print(root[\"data\"], end=\" \")\n        inorder(root[\"right\"])\n\n# Main code to insert values\nroot = None\nvalues = [40, 20, 60, 10, 30, 50, 70]\nfor val in values:\n    root = insert(root, val)\nprint(\"BST Inorder Traversal:\")\ninorder(root)","out":"BST Inorder Traversal:\n10 20 30 40 50 60 70"},{"id":"Practical 5c","q":"Search for a node in a binary search tree.","code":"# Create a new node\ndef create_node(data):\n    return {\"data\": data, \"left\": None, \"right\": None}\n\n# Insert a node into BST\ndef insert(root, data):\n    if root is None:\n        return create_node(data)\n    if data \u003c root[\"data\"]:\n        root[\"left\"] = insert(root[\"left\"], data)\n    else:\n        root[\"right\"] = insert(root[\"right\"], data)\n    return root\n\n# Search for a node\ndef search(root, key):\n    if root is None:\n        return False\n    if key == root[\"data\"]:\n        return True\n    elif key \u003c root[\"data\"]:\n        return search(root[\"left\"], key)\n    else:\n        return search(root[\"right\"], key)\n\n# Build the BST\nroot = None\nvalues = [50, 30, 70, 20, 40, 60, 80]\nfor val in values:\n    root = insert(root, val)\n\n# Search test\nkey = 60\nif search(root, key):\n    print(f\"{key} found in BST.\")\nelse:\n    print(f\"{key} not found in BST.\")","out":"60 found in BST."},{"section":"Sorting Algorithm","id":"Practical 8a","q":"Bubble Sort.","code":"# List to sort\na = [10, 3, 7, 1, 9]\n\n# Bubble Sort\nfor i in range(len(a)):\n    for j in range(len(a) - i - 1):\n        if a[j] > a[j + 1]:\n            a[j], a[j + 1] = a[j + 1], a[j]\n\n# Output sorted list\nprint(\"Sorted List:\", a)","out":"Sorted List: [1,3,7,9,10]"},{"id":"Practical 8b","q":"Insertion Sort.","code":"# List to sort\na = [8, 4, 1, 5, 9]\n\n# Insertion Sort\nfor i in range(1, len(a)):\n    key = a[i]\n    j = i - 1\n    while j >= 0 and a[j] > key:\n        a[j + 1] = a[j]\n        j -= 1\n    a[j + 1] = key\n\n# Print output\nprint(\"Sorted List:\", a)","out":"Sorted List: [ 1,4,5,8,9]"},{"id":"Practical 8c","q":"Selection Sort.","code":"a = [29, 10, 14, 37, 13]\nfor i in range(len(a)):\n    min_idx = i\n    for j in range(i + 1, len(a)):\n        if a[j] \u003c a[min_idx]:\n            min_idx = j\n    a[i], a[min_idx] = a[min_idx], a[i]\nprint(\"Sorted List:\", a)","out":"Sorted List: [10, 13, 14, 29, 37]"},{"section":"Searching Algorithm","id":"Practical 9a","q":"Linear Search.","code":"# List to search\na = [10, 20, 30, 40, 50]\nkey = 30\nfound = False\n\n# Linear Search algorithm\nfor i in range(len(a)):\n    if a[i] == key:\n        print(\"Found at index\", i)\n        found = True\n        break\nif not found:\n    print(\"Not found\")","out":"Found at index 2"},{"id":"Practical 9b","q":"Binary Search (on a sorted array).","code":"# Sorted list to search\na = [10, 20, 30, 40, 50]\nkey = 40\nlow = 0\nhigh = len(a) - 1\n\n# Binary Search algorithm\nwhile low \u003c= high:\n    mid = (low + high) // 2\n    if a[mid] == key:\n        print(\"Found at index\", mid)\n        break\n    elif key \u003c a[mid]:\n        high = mid - 1\n    else:\n        low = mid + 1\nelse:\n    print(\"Not found\")","out":"Found at index 3"}]};
let cur='python';try{cur=localStorage.getItem('tab')||'python'}catch(e){}
const m=document.getElementById('m'),q=document.getElementById('q');
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function block(label,text,cls){const w=document.createElement('div');const l=el('div','lbl');l.appendChild(el('span',null,label));
 const b=el('button','cp','Copy');b.onclick=()=>{try{navigator.clipboard.writeText(text);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}catch(e){}};
 l.appendChild(b);w.appendChild(l);w.appendChild(el('pre',cls,text));return w}
function render(){
 document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===cur));
 m.replaceChildren();const s=q.value.trim().toLowerCase();let n=0;
 DATA[cur].forEach(p=>{
  const hay=(p.id+' '+p.q+' '+p.code+' '+(p.code2||'')+' '+p.out+' '+(p.section||'')).toLowerCase();
  if(s&&!hay.includes(s))return;n++;
  if(p.section&&!s)m.appendChild(el('h2','sec',p.section));
  const c=el('div','card');c.appendChild(el('h3',null,p.id));c.appendChild(el('p','q',p.q));
  c.appendChild(block(p.codeTitle?'Answer — '+p.codeTitle:'Answer (code)',p.code));
  if(p.code2)c.appendChild(block('Answer — '+p.code2Title,p.code2));
  c.appendChild(block('Output',p.out,'o'));m.appendChild(c)});
 if(!n)m.appendChild(el('div','empty','No practicals match your search.'))}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cur=t.dataset.k;try{localStorage.setItem('tab',cur)}catch(e){}render();window.scrollTo(0,0)});
q.oninput=render;render();
